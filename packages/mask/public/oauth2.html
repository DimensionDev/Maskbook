<!doctype html>
<html>
    <head>
        <title>Google Auth</title>
    </head>
    <body>
        <h1>Google Auth, process...</h1>
        <script>
            const urlParams = new URLSearchParams(window.location.search)
            const code = urlParams.get('code')
            if (code) {
                window.opener.postMessage({ code }, '*')
                window.close()
            }
        </script>
    </body>
</html>
